name: build
on: [push]

jobs:
  all:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
#        os: [macos-latest, ubuntu-latest, windows-latest]
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install libsctp-dev libgnutls28-dev libgcrypt-dev libidn2-dev
      - name: install dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          # Remove Python3 symlinks in /usr/local/bin as workaround to brew update issues
          # https://github.com/actions/setup-python/issues/577
          rm -f /usr/local/bin/2to3*
          rm -f /usr/local/bin/idle3*
          rm -f /usr/local/bin/pydoc*
          rm -f /usr/local/bin/python3*
          brew update
          brew install gnutls libgcrypt libidn2
#      - name: install dependencies (Windows)
#        if: ${{ runner.os == 'Windows' }}
#        uses: lukka/run-vcpkg@v7
#        id: runvcpkg
#        with:
#          vcpkgGitCommitId: 8bb3f9e4a08a5b71ee93a6f1bcdd7a258bb48392
#          vcpkgTriplet: x64-windows
#          vcpkgArguments: zlib bzip2 liblzma zstd
      - name: prepare build directory
        run: |
          cmake -E make_directory ${{runner.workspace}}/build
      - name: configure (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: ${{runner.workspace}}/build
        run: |
          cmake ${{github.workspace}}
      - name: configure (macOS)
        if: ${{ runner.os == 'macOS' }}
        working-directory: ${{runner.workspace}}/build
        run: |
          cmake -DDISABLE_SCTP:BOOL=ON ${{github.workspace}}
#      - name: configure (Windows)
#        if: ${{ runner.os == 'Windows' }}
#        working-directory: ${{runner.workspace}}/build
#        run: |
#          cmake -DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake ${{github.workspace}}
      - name: build
        working-directory: ${{runner.workspace}}/build
        run: |
          cmake --build . --config Release
      - name: test
        working-directory: ${{runner.workspace}}/build
        run: |
          ctest -V -C Release

  multi-peer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tls: ["OFF", "ON"]
        sctp: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libsctp-dev libgnutls28-dev libgcrypt-dev libidn2-dev libjsoncpp-dev openssl python3-dev swig
      - name: check SCTP support
        if: ${{ matrix.sctp == 'ON' }}
        run: |
          python3 -c 'import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM, socket.getprotobyname("sctp")).close()'
      - name: configure
        run: |
          cmake -S . -B test.build \
            -DBUILD_MULTI_PEER_TESTS=ON \
            -DBUILD_TEST_APP=ON \
            -DBUILD_DBG_INTERACTIVE=ON \
            -DBUILD_DBG_DICT_DUMP_JSON=ON \
            -DBUILD_RT_EREG=ON \
            -DBUILD_APP_REDIRECT=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DMULTI_PEER_USE_TLS=${{ matrix.tls }} \
            -DMULTI_PEER_USE_SCTP=${{ matrix.sctp }}
      - name: build
        run: cmake --build test.build --parallel 2
      - name: test
        run: ctest --test-dir test.build -L multi-peer --no-tests=error --output-on-failure
