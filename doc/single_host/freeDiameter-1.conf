
# -------- Test-only configuration ---------
# No_TLS sends Diameter traffic in cleartext. Use only in an isolated test
# environment; it provides no confidentiality or peer authentication.

Identity = "peer1.localdomain";
Realm = "localdomain";
# Port = 3868;
# SecPort = 3869;

TLS_Cred = "single-host-certs/peer1.cert.pem",
	   "single-host-certs/peer1.key.pem";
TLS_CA = "single-host-certs/cacert.pem";

LoadExtension = "extensions/test_app.fdx" : "test_app1.conf";

ConnectPeer = "peer2.localdomain" { ConnectTo = "127.0.0.1"; No_TLS; port = 30868; };

