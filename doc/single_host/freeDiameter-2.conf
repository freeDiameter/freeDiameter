# -------- Test-only configuration ---------
# No_TLS sends Diameter traffic in cleartext. Use only in an isolated test
# environment; it provides no confidentiality or peer authentication.

Identity = "peer2.localdomain";
Realm = "localdomain";
Port = 30868;
SecPort = 30869;

TLS_Cred = "single-host-certs/peer2.cert.pem",
	   "single-host-certs/peer2.key.pem";
TLS_CA = "single-host-certs/cacert.pem";

LoadExtension = "extensions/test_app.fdx" : "test_app2.conf";

ConnectPeer = "peer1.localdomain" { ConnectTo = "127.0.0.1"; No_TLS; };

